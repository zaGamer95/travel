title: 여행 기록
description: 다녀온 여행들을 기록합니다.
lang: ko
url: "https://wonbo.site"
baseurl: "/travel"
home_url: "https://wonbo.site/"

timezone: Asia/Seoul
markdown: kramdown

# 여행 글은 _trips/ 폴더에 둡니다.
#   _trips/2025-tokyo.md        -> /travel/2025-tokyo/
#   _trips/2025-tokyo/day-2.md  -> /travel/2025-tokyo/day-2/
collections:
  trips:
    output: true
    permalink: /:path/

defaults:
  - scope:
      path: ""
      type: trips
    values:
      layout: trip

# 메인 페이지 탭에 따로 보여줄 나라. 나머지는 모두 "그 외" 탭으로 갑니다.
featured_countries: [korea, japan, singapore]

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - scripts/
  - raw/
  - vendor/
