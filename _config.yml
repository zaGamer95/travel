title: Travels
description: Trips I have taken, and trips coming up.
lang: en
url: "https://wonbo.site"
baseurl: "/travel"
home_url: "https://wonbo.site/"

timezone: Asia/Seoul
markdown: kramdown
# Planned trips (planned: true) have future dates, so this is needed for their pages to be built.
future: true

# Trip posts live in _trips/.
#   _trips/2025-tokyo.md        -> /travel/2025-tokyo/
#   _trips/2025-tokyo/day-2.md  -> /travel/2025-tokyo/day-2/
collections:
  trips:
    output: true
    permalink: /:path/

defaults:
  - scope:
      path: ""
      type: trips
    values:
      layout: trip

# Countries that get their own tab on the home page. Everything else goes under "Other".
featured_countries: [korea, japan, singapore]

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - scripts/
  - raw/
  - vendor/
