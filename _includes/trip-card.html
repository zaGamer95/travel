{% assign t = include.trip %}
<article class="trip-card" data-countries="{{ t.countries | join: ' ' }}">
  <a class="trip-cover" href="{{ t.url | relative_url }}">
    {% if t.cover %}<img src="{{ '/assets/photos/' | append: t.trip_slug | append: '/' | append: t.cover | relative_url }}" alt="" loading="lazy">{% endif %}
  </a>
  <div class="trip-body">
    <h2><a href="{{ t.url | relative_url }}">{{ t.title }}</a></h2>
    <p class="meta">
      {{ t.date | date: "%Y.%m.%d" }}{% if t.end_date %} – {{ t.end_date | date: "%m.%d" }}{% endif %}
      {% include country-tags.html countries=t.countries %}
    </p>
    {% if t.summary %}<p>{{ t.summary }}</p>{% endif %}
  </div>
</article>
